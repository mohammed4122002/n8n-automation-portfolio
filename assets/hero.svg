<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="n8n Automation Portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1a1240"/><stop offset="1" stop-color="#3a0f3a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6D5A"/><stop offset="0.5" stop-color="#FFB86C"/><stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5"><stop offset="0" stop-color="#FF6D5A" stop-opacity="0.35"/><stop offset="1" stop-color="#FF6D5A" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.85" r="0.5"><stop offset="0" stop-color="#7B61FF" stop-opacity="0.45"/><stop offset="1" stop-color="#7B61FF" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><rect width="1200" height="440" rx="28"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI','Noto Sans Arabic','Cairo',Tahoma,Arial,sans-serif}
    .flow{stroke-dasharray:10 12;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-44}}
    .node{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .n2{animation-delay:.5s}.n3{animation-delay:1s}.n4{animation-delay:1.5s}.n5{animation-delay:2s}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .rise{opacity:0;animation:rise .9s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.2s}.d2{animation-delay:.6s}
    .line{opacity:0;animation:cycle 12s infinite}
    .l2{animation-delay:3s}.l3{animation-delay:6s}.l4{animation-delay:9s}
    @keyframes cycle{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:translateY(0)}26%,100%{opacity:0;transform:translateY(-10px)}}
    .spark{animation:tw 2.4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .shine{animation:shine 5s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1600px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#glow1)"/>
    <rect width="1200" height="440" fill="url(#glow2)"/>
    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
      <path d="M100 0V440M200 0V440M300 0V440M400 0V440M500 0V440M600 0V440M700 0V440M800 0V440M900 0V440M1000 0V440M1100 0V440"/>
    </g>
    <!-- sparks -->
    <g fill="#fff">
      <circle class="spark" cx="140" cy="70" r="2"/><circle class="spark" style="animation-delay:.6s" cx="420" cy="40" r="1.6"/>
      <circle class="spark" style="animation-delay:1.1s" cx="760" cy="60" r="2.2"/><circle class="spark" style="animation-delay:1.7s" cx="1080" cy="110" r="1.8"/>
      <circle class="spark" style="animation-delay:.3s" cx="1130" cy="330" r="2"/><circle class="spark" style="animation-delay:2s" cx="60" cy="300" r="1.6"/>
    </g>

    <!-- workflow diagram (top-right) -->
    <g class="float" transform="translate(0,0)">
      <g fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round">
        <path class="flow" d="M690 110 C760 110 760 170 830 170"/>
        <path class="flow" d="M830 170 C900 170 900 110 970 110"/>
        <path class="flow" d="M830 170 C900 170 900 240 970 240"/>
        <path class="flow" d="M970 110 C1040 110 1040 170 1100 170"/>
        <path class="flow" d="M970 240 C1040 240 1040 170 1100 170"/>
      </g>
      <g>
        <g class="node"><rect x="640" y="82" width="56" height="56" rx="14" fill="#FF6D5A"/><text x="668" y="119" font-size="26" text-anchor="middle" fill="#fff">⚡</text></g>
        <g class="node n2"><rect x="802" y="142" width="56" height="56" rx="14" fill="#7B61FF"/><text x="830" y="179" font-size="26" text-anchor="middle" fill="#fff">🤖</text></g>
        <g class="node n3"><rect x="942" y="82" width="56" height="56" rx="14" fill="#24B89A"/><text x="970" y="119" font-size="26" text-anchor="middle" fill="#fff">📧</text></g>
        <g class="node n4"><rect x="942" y="212" width="56" height="56" rx="14" fill="#FFB86C"/><text x="970" y="249" font-size="26" text-anchor="middle" fill="#fff">📊</text></g>
        <g class="node n5"><rect x="1072" y="142" width="56" height="56" rx="14" fill="#3B82F6"/><text x="1100" y="179" font-size="26" text-anchor="middle" fill="#fff">✈️</text></g>
      </g>
    </g>

    <!-- texts -->
    <g class="rise d1">
      <text x="70" y="140" font-size="22" font-weight="600" fill="#FFB86C" letter-spacing="6">N8N · AUTOMATION · PORTFOLIO</text>
      <text x="70" y="222" font-size="76" font-weight="800" fill="url(#brand)">n8n Automation</text>
      <text x="70" y="290" font-size="76" font-weight="800" fill="#ffffff">Portfolio</text>
    </g>
    <g class="rise d2">
      <text class="line" x="72" y="352" font-size="28" fill="#e6e8ff" direction="rtl">أتمتة عملية، خطوة بخطوة</text>
      <text class="line l2" x="72" y="352" font-size="28" fill="#e6e8ff">30 workflows ready to import &amp; run</text>
      <text class="line l3" x="72" y="352" font-size="28" fill="#e6e8ff">Gmail · Sheets · Drive · Telegram · AI</text>
      <text class="line l4" x="72" y="352" font-size="28" fill="#e6e8ff">شرح + صور + اختبار لكل مشروع</text>
    </g>
    <!-- shine -->
    <rect class="shine" x="0" y="0" width="120" height="440" fill="#fff" opacity="0.05" transform="skewX(-20)"/>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="url(#brand)" stroke-opacity="0.5" stroke-width="2"/>
</svg>
