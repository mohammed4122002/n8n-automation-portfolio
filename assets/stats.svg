<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Portfolio stats">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1240"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6D5A"/><stop offset="1" stop-color="#7B61FF"/></linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI','Noto Sans Arabic','Cairo',Tahoma,Arial,sans-serif;text-anchor:middle}
    .card{opacity:0;animation:in .8s ease-out forwards,bob 4s ease-in-out infinite}
    .c2{animation-delay:.15s,.15s}.c3{animation-delay:.3s,.3s}.c4{animation-delay:.45s,.45s}
    @keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <g class="card"><rect x="10" y="15" width="270" height="120" rx="20" fill="url(#c)" stroke="url(#b)" stroke-width="2"/><text x="145" y="75" font-size="48" font-weight="800" fill="#FF6D5A">30</text><text x="145" y="108" font-size="18" fill="#cfd3ff">مشروع جاهز</text></g>
  <g class="card c2"><rect x="315" y="15" width="270" height="120" rx="20" fill="url(#c)" stroke="url(#b)" stroke-width="2"/><text x="450" y="75" font-size="48" font-weight="800" fill="#FFB86C">10+</text><text x="450" y="108" font-size="18" fill="#cfd3ff">خدمة متصلة</text></g>
  <g class="card c3"><rect x="620" y="15" width="270" height="120" rx="20" fill="url(#c)" stroke="url(#b)" stroke-width="2"/><text x="755" y="75" font-size="48" font-weight="800" fill="#24B89A">AI</text><text x="755" y="108" font-size="18" fill="#cfd3ff">OpenAI · Gemini</text></g>
  <g class="card c4"><rect x="925" y="15" width="265" height="120" rx="20" fill="url(#c)" stroke="url(#b)" stroke-width="2"/><text x="1057" y="75" font-size="48" font-weight="800" fill="#7B61FF">1-Click</text><text x="1057" y="108" font-size="18" fill="#cfd3ff">استيراد وتشغيل</text></g>
</svg>
