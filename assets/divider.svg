<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="presentation">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF6D5A"/><stop offset=".5" stop-color="#FFB86C"/><stop offset="1" stop-color="#7B61FF"/></linearGradient></defs>
  <style>.m{animation:s 3s ease-in-out infinite alternate}@keyframes s{from{transform:translateX(0)}to{transform:translateX(1020px)}}</style>
  <rect width="1200" height="4" y="2" rx="2" fill="url(#g)" opacity=".45"/>
  <rect class="m" width="180" height="8" rx="4" fill="url(#g)"/>
</svg>
